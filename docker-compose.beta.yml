name: woordenboom-beta

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: woordenboom
      POSTGRES_USER: woordenboom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woordenboom -d woordenboom"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [database]

  migrate:
    image: migrate/migrate:v4.18.1
    profiles: [setup]
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=${DATABASE_URL:?Set DATABASE_URL}", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    environment:
      API_ADDR: :8080
      APP_ENV: production
      VOCABULARY_BATCH: release-9500
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      EMAIL_PROVIDER: mailjet
      MAILJET_API_KEY: ${MAILJET_API_KEY:?Set MAILJET_API_KEY}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:?Set MAILJET_SECRET_KEY}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?Set AUTH_EMAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [frontend, database]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/mailjet-verification:/srv/mailjet-verification:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    networks: [frontend]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  frontend:
  database:
    internal: true
