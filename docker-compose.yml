services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: woordenboom
      POSTGRES_USER: woordenboom
      POSTGRES_PASSWORD: woordenboom
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woordenboom -d woordenboom"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://woordenboom:woordenboom@postgres:5432/woordenboom?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./services/api
    environment:
      API_ADDR: :8080
      VOCABULARY_BATCH: ${VOCABULARY_BATCH:-release-9500}
      APP_ENV: development
      AUTH_SECRET: local-development-secret-change-before-production
      DATABASE_URL: postgres://woordenboom:woordenboom@postgres:5432/woordenboom?sslmode=disable
      SMTP_ADDR: mailpit:1025
      AUTH_EMAIL_FROM: login@woordenboom.local
      TYPESAFE_API_KEY: ${typesafe_ai_api_key:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  postgres-data:
