name: Beta API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woordenboom-beta-api
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Test API
        working-directory: services/api
        run: go test ./...
      - name: Validate release data
        run: |
          python3 scripts/vocabulary_release.py validate
          python3 scripts/word_definitions.py validate
          python3 scripts/category_release.py validate
      - name: Validate Compose configuration
        run: docker compose --env-file deploy/beta.env.example -f docker-compose.beta.yml config --quiet
      - name: Build API image
        run: docker compose --env-file deploy/beta.env.example -f docker-compose.beta.yml build api

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.BETA_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: beta
    timeout-minutes: 45
    steps:
      - name: Deploy on Hetzner
        env:
          DEPLOY_HOST: ${{ vars.BETA_DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ vars.BETA_DEPLOY_HOST_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.BETA_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?Set BETA_DEPLOY_HOST}"
          : "${DEPLOY_HOST_KEY:?Set BETA_DEPLOY_HOST_KEY}"
          : "${DEPLOY_SSH_KEY:?Set BETA_DEPLOY_SSH_KEY}"

          ssh_dir="$RUNNER_TEMP/woordenboom-ssh"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          chmod 0600 "$ssh_dir/key"
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/known_hosts"

          ssh -T -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            "root@$DEPLOY_HOST" "deploy $GITHUB_SHA"
